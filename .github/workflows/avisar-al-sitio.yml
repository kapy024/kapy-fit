name: Avisar al sitio que kapy-fit cambió
on:
  push:
    branches: [main]
jobs:
  avisar:
    runs-on: ubuntu-latest
    steps:
      - name: repository_dispatch a kapy024-site
        env:
          TOKEN: ${{ secrets.TOKEN_DESPLIEGUE_SITIO }}
        run: |
          : "${TOKEN:?Falta el secret TOKEN_DESPLIEGUE_SITIO en kapy-fit}"
          curl -sS -f -X POST \
            -H "Authorization: Bearer $TOKEN" \
            -H "Accept: application/vnd.github+json" \
            https://api.github.com/repos/kapy024/kapy024-site/dispatches \
            -d '{"event_type":"kapy-fit-actualizado"}'
